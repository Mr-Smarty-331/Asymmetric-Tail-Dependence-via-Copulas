[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra -q
markers =
    network: marks tests as requiring internet/external API access (deselect with '-m "not network"')
    llm: marks tests as requiring real LLM provider API credentials (deselect with '-m "not llm"')
    slow: marks long-running simulations or backtests
